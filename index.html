<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Language Day 🌟</title>
<style>
:root{--bl:#1e4fa8;--sky:#cfe6f7;--yl:#fbe97a;--pk:#e8707a;--bg:#eaf4fc;--tx:#12307a;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2347;--card:#16356b;--tx:#eaf4ff;--sky:#1c3f7a}}
:root[data-theme="dark"]{--bg:#0f2347;--card:#16356b;--tx:#eaf4ff;--sky:#1c3f7a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;text-align:center}
header{background:linear-gradient(#7fc0ec,var(--sky));padding:12px 10px 6px;position:relative;overflow:hidden}
h1{display:inline-block;background:var(--yl);color:#12307a;margin:4px;padding:8px 16px;border-radius:14px;font-size:1.15rem;transform:rotate(-1.5deg)}
.sub{color:var(--bl);font-weight:bold;margin:3px;font-size:.9rem}
.kids{font-size:2.3rem;animation:bob 2s ease-in-out infinite}
.cloud{position:absolute;font-size:2rem;opacity:.8;animation:fly 18s linear infinite}
@keyframes fly{from{left:-10%}to{left:110%}}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
nav{display:flex;gap:6px;justify-content:center;padding:10px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
button{font:inherit;cursor:pointer;border:0}
nav button{background:var(--bl);color:#fff;padding:8px 12px;border-radius:12px;font-weight:bold;font-size:.9rem}
nav button.on{background:var(--yl);color:#12307a;transform:scale(1.08)}
.ban{display:inline-block;background:var(--bl);color:#fff;padding:8px 20px;border-radius:12px;font-size:1.2rem;margin:8px 0}
.ban.pk{background:var(--pk)}.ban.yl{background:var(--yl);color:#12307a}
.say{background:var(--yl);color:#12307a;padding:10px 16px;border-radius:20px;font-weight:bold;margin:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;padding:10px;max-width:780px;margin:auto}
.fl{perspective:800px;height:120px;animation:pop .4s backwards;cursor:pointer}
.in{position:relative;height:100%;transition:transform .6s;transform-style:preserve-3d}
.fl.f .in{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--bl);border-radius:16px;background:var(--card);display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px}
.fb{transform:rotateY(180deg);background:var(--yl);color:#12307a}
.o .fa{border-color:var(--pk)}.o .fb{background:#ffd3d6}
.fl b{font-size:1.2rem}.ar{font-size:.95rem;color:var(--pk);font-weight:bold}.fb .ar{color:#a02a35}
.tip{font-size:.8rem;opacity:.7}
#quiz{max-width:480px;margin:10px auto;background:var(--card);border:3px dashed var(--bl);border-radius:18px;padding:14px}
#opts button{display:block;width:90%;margin:7px auto;padding:10px;border-radius:12px;background:var(--sky);color:var(--tx);font-size:1.05rem;font-weight:bold}
.ok{background:#7be08a!important}.no{background:#ff9d9d!important}
.big{font-size:3rem;animation:bob 1s infinite}
footer{background:var(--bl);color:#fff;padding:12px;margin-top:16px;font-weight:bold}
#mus{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--yl);color:#12307a;border-radius:50%;width:52px;height:52px;font-size:1.5rem;box-shadow:0 3px 8px #0005;z-index:9}

nav{flex-wrap:nowrap;gap:4px;padding:8px 6px;overflow-x:auto}nav button{padding:8px 9px;font-size:.78rem;white-space:nowrap}
.home{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px;max-width:520px;margin:auto}
.hc{border-radius:22px;padding:18px 8px;color:#fff;cursor:pointer;box-shadow:0 5px 0 #0003;animation:pop .5s backwards,bob 3s ease-in-out infinite;transition:transform .15s}
.hc:active{transform:scale(.93)}.hc .ic{font-size:2.6rem;display:block}.hc b{font-size:1.1rem;display:block}.hc small{font-size:.8rem;opacity:.95}
.c1{background:var(--bl)}.c2{background:var(--pk)}.c3{background:#2fa36b;animation-delay:.1s,.4s}.c4{background:#12307a;border:3px solid var(--yl);animation-delay:.2s,.8s}
.steps{max-width:520px;margin:10px auto;background:var(--card);border-radius:16px;padding:10px;font-weight:bold;font-size:.9rem;line-height:1.9}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:5px;padding:6px;max-width:780px;margin:auto}
.vc{background:var(--card);color:var(--tx);border:2px solid var(--bl);border-radius:10px;padding:5px 2px;font-size:.8rem;font-weight:bold}
.vc small{display:block;font-size:.62rem;color:var(--pk)}.vc.seen{background:var(--yl);color:#12307a}
.vc.tap{animation:vp .5s}@keyframes vp{40%{transform:scale(1.2) rotate(-3deg)}}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:4;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bl);color:#fff;border:3px solid var(--yl);border-radius:16px;padding:8px;margin:6px auto;max-width:780px;min-height:96px}
.w{opacity:0;transform:translateX(var(--x,0)) translateY(var(--y,0));min-width:84px}.w.in{opacity:1;transform:none;transition:all .5s cubic-bezier(.3,1.6,.5,1)}
.w small{display:block;font-size:.65rem;color:var(--yl)}.w b{font-size:1.45rem;display:inline-block;min-height:1.7rem}
.w0{--x:-60px}.w1{--y:40px}.w2{--x:60px}.w.pulse{animation:pl .5s}@keyframes pl{50%{transform:scale(1.3);color:var(--yl)}}
.ar2{flex-basis:100%;font-size:1.05rem;color:var(--yl);font-weight:bold;opacity:0;transition:opacity .4s}.ar2.in{opacity:1}

.vg{grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:4px}
.vc{font-size:.68rem;padding:4px 1px;border-radius:8px;animation:pop .4s backwards,sw 3.5s ease-in-out infinite;animation-delay:var(--d,0s),var(--d,0s)}
.vc small{font-size:.54rem}
.vc:active{transform:scale(.85)}
.stage{animation:glow 2s ease-in-out infinite}
.w b{font-size:1.2rem}.w small{font-size:.58rem}.ar2{font-size:.9rem}
.w.in b{animation:jig 1.4s ease-in-out infinite}
.stage>span{animation:bob 1.8s ease-in-out infinite;font-size:.9rem}
.fl b{font-size:1rem}.fl .ar{font-size:.8rem}
.fl:nth-child(odd) .fa{animation:sw 3s ease-in-out infinite}
.fl:nth-child(even) .fa{animation:sw 3s ease-in-out infinite reverse}
@keyframes sw{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-3px) rotate(1.2deg)}}
@keyframes jig{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-2px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 #fbe97a00}50%{box-shadow:0 0 14px #fbe97aaa}}


.car{width:min(86vw,300px);margin:6px auto 0;overflow:hidden;border-radius:22px;background:linear-gradient(#ffffffaa,#ffffff55);border:3px solid var(--yl);padding:6px 0 8px;position:relative}
.trk{display:flex;width:300%;transition:transform .6s cubic-bezier(.5,1.4,.5,1)}
.sl{width:33.3333%;padding:0 8px;cursor:pointer}
.av{position:relative;width:150px;height:150px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff 0,#a9d7f5 70%);border:4px solid var(--bl);overflow:hidden;box-shadow:0 6px 0 #1e4fa855}
.av img{width:100%;height:100%;display:block}
.sp{position:absolute;font-style:normal;font-size:1.1rem;opacity:0}
.s1{left:8%;top:10%}.s2{right:8%;top:20%}.s3{left:20%;bottom:8%}
.sl.on .sp{animation:tw 1.6s ease-in-out infinite}.s2{animation-delay:.5s!important}.s3{animation-delay:1s!important}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.2) rotate(20deg)}}
.sl.on .av{animation:avin .7s cubic-bezier(.3,1.7,.5,1),bob 2.4s .7s ease-in-out infinite}
@keyframes avin{from{transform:scale(.3) rotate(-25deg);opacity:0}}
.nm{display:inline-block;margin-top:6px;background:var(--bl);color:#fff;padding:2px 16px;border-radius:12px;font-size:1.1rem}
.ph{margin-top:5px;font-weight:bold;color:var(--tx);min-height:2.4em;font-size:.95rem}
.sl.on .nm{animation:nmi .6s .15s backwards}.sl.on .ph{animation:phi .7s .3s backwards}
@keyframes nmi{from{transform:translateX(-80px);opacity:0}}@keyframes phi{from{transform:translateY(25px) scale(.8);opacity:0}}
.dots{display:flex;justify-content:center;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--bl);transition:.3s}.dots i.on{background:var(--yl);transform:scale(1.4)}

.car{border:0;background:none;padding:0;width:min(94vw,340px)}
.sl{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"av nm" "av ph";align-items:center;column-gap:28px;padding:2px 10px}
.av{grid-area:av;width:90px;height:90px;margin:0;border-width:3px;box-shadow:none}
.nm{grid-area:nm;justify-self:start;align-self:end;margin:0;font-size:1rem;padding:1px 12px}
.ph{grid-area:ph;align-self:start;text-align:left;min-height:0;font-size:.82rem;margin-top:4px}
.hand{position:absolute;left:90px;top:2px;font-size:1.5rem;font-style:normal;opacity:0;transform-origin:20% 90%}
.sl.on .hand{opacity:1;animation:hw .6s ease-in-out infinite alternate}
@keyframes hw{from{transform:rotate(-22deg)}to{transform:rotate(28deg)}}
</style></head><body>

const intro={home:"Welcome superstars! Pick a section and start your English adventure!",
syn:"Hello superstars! Synonyms are words that have the same or similar meaning. Same meaning, more choices! Tap a card and watch it flip!",
opp:"Hey champions! Opposites are words with different meanings. Hot is the opposite of cold! Opposites make language richer! Tap a card to flip it!",
irr:"Get ready for a verb adventure! Irregular verbs do not follow the rule. They change in a funny way! Tap any verb to see its past and past participle!",

const ar={syn:"كلمات لها نفس المعنى 🤝 — اكبس على البطاقة لتنقلب وتشوف المرادف!",opp:"كلمات متضادة ⚡ — اكبس على البطاقة لتنقلب وتشوف العكس!",irr:"أفعال شاذة 🚀 — اكبس على الفعل لتنقلب وتشوف الماضي واسم المفعول مع الترجمة!"};
const names={home:"Home 🏠",syn:"Synonyms 🤝",opp:"Opposites ⚡",irr:"Irregular Verbs 🚀",con:"Contest 🏆"};
let tab="home";
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;u.pitch=1.25;speechSynthesis.speak(u)}catch(e){}}
function sfx(f,d=.15){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state=="suspended")ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="triangle";g.gain.setValueAtTime(.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
function render(){
const m=document.getElementById("main");
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
document.getElementById("hd").style.display=tab=="home"?"":"none";
if(tab=="home"){m.innerHTML=`<div class="ban">Choose your adventure 🚀</div><p>اختاروا القسم وابدأوا الرحلة!</p><button class="say" data-say="1">🔊 Welcome!</button><div class="home"><div class="hc c1" data-go="syn"><span class="ic">🤝</span><b>Synonyms</b><small>كلمات بنفس المعنى</small></div><div class="hc c2" data-go="opp"><span class="ic">⚡</span><b>Opposites</b><small>كلمات متضادة</small></div><div class="hc c3" data-go="irr"><span class="ic">🚀</span><b>Irregular Verbs</b><small>50 فعلًا شاذًا</small></div><div class="hc c4" data-go="con"><span class="ic">🏆</span><b>Contest</b><small>مسابقة 10 أسئلة</small></div></div><div class="steps">1️⃣ اختر قسمًا &nbsp; 2️⃣ اكبس على الكلمات واسمع النطق<br>3️⃣ تحدَّ نفسك في المسابقة &nbsp; 4️⃣ شغّل الموسيقى 🎵</div>`;return}
if(tab=="con"){startQuiz();return}
let h=`<div class="ban ${tab=="opp"?"pk":""}">${names[tab]}</div><p>${ar[tab]}</p><button class="say" data-say="intro">🔊 Explain it to me!</button><div class="grid">`;
if(tab=="irr"){h=h.replace('<div class="grid">','<div class="stage" id="stage"><span>👆 Tap a verb! اكبس على فعل</span></div><div class="vg">');h+=verbs.map((v,i)=>`<button class="vc" data-i="${i}" style="--d:${i*.03}s">${v[0]}<small>${v[3]}</small></button>`).join("")}
else{const d=tab=="syn"?syn:opp;h+=d.map((p,i)=>`<div class="fl ${tab=="opp"?"o":""}" data-i="${i}" style="animation-delay:${i*.07}s"><div class="in"><div class="fa"><b>${p[0]}</b><span class="ar">${p[1]}</span></div><div class="fb"><b>${p[2]}</b><span class="ar">${p[3]}</span></div></div></div>`).join("")}
m.innerHTML=h+"</div>";}
document.getElementById("main").onclick=e=>{

let tw=0;const sl=ms=>new Promise(r=>setTimeout(r,ms));
async function typeWords(v){const id=++tw,st=document.getElementById("stage"),lb=["Base","Past","Participle"];
st.innerHTML=[0,1,2].map(i=>`<div class="w w${i}"><small>${lb[i]}</small><b></b></div>`).join("")+`<div class="ar2">${v[3]}</div>`;
await sl(60);st.querySelector(".ar2").classList.add("in");
for(let i=0;i<3;i++){if(id!=tw)return;const w=st.children[i],b=w.querySelector("b");w.classList.add("in");
for(let k=1;k<=v[i].length;k++){if(id!=tw)return;b.textContent=v[i].slice(0,k);sfx(330+i*110+k*14,.05);await sl(65)}
w.classList.add("pulse");sfx(520+i*130,.22);say(v[i].replace("/"," or "));await sl(950)}}
