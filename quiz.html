let ac;function sfx(f,d=.15,t="triangle"){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state=="suspended")ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type=t;g.gain.setValueAtTime(.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}}
/* fireworks */
const cv=document.getElementById("fx"),cx=cv.getContext("2d");let P=[],raf=0;

function burst(x,y){const h=Math.random()*360;for(let k=0;k<48;k++){const a=Math.PI*2*k/48,s=2+Math.random()*4.5;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:h+Math.random()*50,r:2+Math.random()*2})}run()}
function run(){if(raf)return;const f=()=>{cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>.02);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.vy*=.985;p.l-=.013;cx.globalAlpha=p.l;cx.fillStyle=`hsl(${p.h},100%,60%)`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}cx.globalAlpha=1;if(P.length)raf=requestAnimationFrame(f);else{raf=0;cx.clearRect(0,0,cv.width,cv.height)}};raf=requestAnimationFrame(f)}
function fire(n=3){for(let k=0;k<n;k++)setTimeout(()=>{burst(cv.width*(.15+Math.random()*.7),cv.height*(.12+Math.random()*.4));sfx(250+Math.random()*500,.35,"sawtooth")},k*260)}

function start(types){const used=new Set();qs=[];let t=0,pool=[];
while(qs.length<10&&t++<200){if(!pool.length)pool=sh(types);const q=G[pool.pop()]();const key=q.q+(q.sent||"");if(used.has(key))continue;used.add(key);qs.push(q)}
i=0;score=0;streak=0;document.getElementById("hd").style.display="none";ask()}
function ask(){done=0;const q=qs[i];
m.innerHTML=`<div class="top"><span>Question ${i+1}/10</span><span id="mood" style="font-size:1.6rem">🦉</span><span>⭐ ${score} ${streak>=2?"🔥"+streak:""}</span></div><div class="bar"><i style="width:${i*10}%"></i></div>
<div id="qc"><span class="chip">${q.c}</span><div class="q">${q.q}</div>${q.qa?`<div class="qa">${q.qa}</div>`:""}${q.sent?`<div class="sent">“${q.sent}”</div>`:""}<div id="o">${q.o.map(x=>`<button class="opt" dir="auto">${x}</button>`).join("")}</div><div id="fb"></div></div>`;

m.onclick=e=>{const b=e.target.closest(".opt");if(!b||done)return;done=1;const ok=b.textContent===q.ans;

const fb=document.getElementById("fb"),last=i==9,tip=`<div class="tip">💡 ${q.tip}</div>`;

const p=pick(PR);praise(p);fire(3+Math.min(streak,3));[523,659,784,1046].forEach((f,k)=>setTimeout(()=>sfx(f,.2),k*100));
setTimeout(()=>say(q.full||p.replace(/[^\w! ]/g,"")),400);
fb.innerHTML=`<div class="good">${p} ${pick(PA)}</div>${streak>=3?`<div>🔥 ${streak} in a row! ${streak} إجابات متتالية!</div>`:""}${tip}`}
else{streak=0;b.classList.add("no");document.getElementById("mood").textContent="🤗";sfx(200,.3,"sine");
fb.innerHTML=`<div class="try">Almost! Good try 💪 قريب! حاول مرة ثانية</div><div>✅ <b dir="auto">${q.ans}</b></div>${tip}`}

document.getElementById("nx").onclick=()=>{i++;i>=10?result():ask()};
document.getElementById("nx").scrollIntoView({block:"nearest",behavior:"smooth"})}}

m.innerHTML=`<span class="mas">🦉</span><div class="ban" style="background:var(--yl);color:#12307a">Your Result</div><div id="qc"><div class="big">${t[0]}</div><h2>${score} / 10</h2><p>${t[1]}</p><button class="go" id="ag">Play again 🔁</button><button class="go yl" id="mn">Menu 🎯</button></div>`;
