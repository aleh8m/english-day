let tw=0;const sl=ms=>new Promise(r=>setTimeout(r,ms));

st.innerHTML=[0,1,2].map(i=>`<div class="w w${i}"><small>${lb[i]}</small><b></b></div>`).join("")+`<div class="ar2">${v[3]}</div>`;

/* contest */
let qn=0,score=0;const sh=a=>a.sort(()=>Math.random()-.5),pick=a=>a[Math.random()*a.length|0];
function startQuiz(){qn=0;score=0;nextQ()}
function nextQ(){
const m=document.getElementById("main");
if(qn>=10){const st=score>=9?"🏆🌟🌟🌟":score>=6?"🥈🌟🌟":"🥉🌟";m.innerHTML=`<div class="ban yl">Contest Result</div><div id="quiz"><div class="big">${st}</div><h2>${score} / 10</h2><p>${score>=9?"Superstar! نجم ساطع! 🎉":score>=6?"Great job! أحسنت! 👏":"Keep practicing! تدرّب أكثر وبتصير بطل 💪"}</p><button class="say" id="again">Play again 🔁</button></div>`;
document.getElementById("again").onclick=startQuiz;say(score>=6?"Great job champion!":"Keep practicing!");return}
const t=pick(["syn","opp","past","pp","ar"]);let q,ans,pool;
if(t=="syn"||t=="opp"){const d=t=="syn"?syn:opp,p=pick(d);q=`${t=="syn"?"Same meaning as":"Opposite of"} "${p[0]}"?`;ans=p[2];pool=d.map(x=>x[2])}
else if(t=="past"){const v=pick(verbs);q=`Past simple of "${v[0]}"?`;ans=v[1];pool=verbs.map(x=>x[1])}
else if(t=="pp"){const v=pick(verbs);q=`Past participle of "${v[0]}"?`;ans=v[2];pool=verbs.map(x=>x[2])}
else{const v=pick(verbs);q=`ما معنى "${v[0]}"؟`;ans=v[3];pool=verbs.map(x=>x[3])}
const o=sh([...new Set(pool.filter(x=>x!=ans))]).slice(0,2).concat(ans);sh(o);
m.innerHTML=`<div class="ban yl">Contest 🏆 ${qn+1}/10</div><div id="quiz"><b>Score: ${score} ⭐</b><p style="font-size:1.25rem">${q}</p><div id="opts">${o.map(x=>`<button>${x}</button>`).join("")}</div></div>`;
if(t!="ar")say(q.replace(/"/g,""));
let done=0;document.getElementById("opts").onclick=e=>{if(e.target.tagName!="BUTTON"||done)return;
if(e.target.textContent==ans){done=1;e.target.classList.add("ok");score++;qn++;[523,659,784].forEach((f,i)=>setTimeout(()=>sfx(f),i*110));say("Great!");setTimeout(nextQ,1200)}
else{done=1;e.target.classList.add("no");sfx(180,.3);qn++;[...e.currentTarget.children].forEach(b=>{if(b.textContent==ans)b.classList.add("ok")});say("Oops!");setTimeout(nextQ,1600)}}}
