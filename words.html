const sets=DATA.split("\n##\n").map(s=>s.split("\n").map(l=>l.split("|")));
const setsEl=document.getElementById("sets"),grid=document.getElementById("grid");
function show(i){
  [...setsEl.children].forEach((b,j)=>b.classList.toggle("on",i===j));
  grid.innerHTML="";
  sets[i].forEach(([w,ar,ex])=>{
    const c=document.createElement("div");c.className="card";
    c.innerHTML='<div class="in"><div class="f"></div><div class="b"><div class="ar" dir="auto"></div><div class="ex"></div></div></div>';
    c.querySelector(".f").textContent=w;
    c.querySelector(".ar").textContent=ar;
    c.querySelector(".ex").textContent=ex;
    const sp=document.createElement("button");sp.className="sp";sp.textContent="🔊";
    sp.onclick=e=>{e.stopPropagation();try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w+". "+ex);u.lang="en-US";speechSynthesis.speak(u)}catch(_){}};
    c.querySelector(".b").appendChild(sp);
    c.onclick=()=>c.classList.toggle("flip");
    grid.appendChild(c);
  });
}
sets.forEach((_,i)=>{const b=document.createElement("button");b.textContent="Set "+(i+1);b.onclick=()=>show(i);setsEl.appendChild(b)});
show(0);
