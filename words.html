const setsEl=document.getElementById("sets"),grid=document.getElementById("grid");let cur=0;
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}}
function show(i){cur=i;
  [...setsEl.querySelectorAll("button")].forEach((b,j)=>b.classList.toggle("on",i===j));
  document.getElementById("ttl").textContent="Set "+(i+1)+" 📚";
  grid.innerHTML=sets[i].map(([w,ar,ex],k)=>`<div class="fl" data-k="${k}" style="animation-delay:${k*.05}s"><div class="in"><div class="fa"><b></b></div><div class="fb"><span class="ar"></span><span class="ex"></span></div></div></div>`).join("");
  [...grid.children].forEach((c,k)=>{const [w,ar,ex]=sets[i][k];c.querySelector(".fa b").textContent=w;c.querySelector(".ar").textContent=ar;c.querySelector(".ex").textContent=ex});
}
grid.onclick=e=>{const c=e.target.closest(".fl");if(!c)return;c.classList.toggle("f");const [w,ar,ex]=sets[cur][+c.dataset.k];say(c.classList.contains("f")?w+". "+ex:w)};
document.getElementById("spk").onclick=()=>say(sets[cur].map(x=>x[0]).join(". "));
