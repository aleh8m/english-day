<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Top 20 Phrases ⭐</title>
<style>
:root{--bl:#1e4fa8;--sky:#cfe6f7;--yl:#fbe97a;--pk:#e8707a;--bg:#eaf4fc;--tx:#12307a;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2347;--card:#16356b;--tx:#eaf4ff;--sky:#1c3f7a}}
:root[data-theme="dark"]{--bg:#0f2347;--card:#16356b;--tx:#eaf4ff;--sky:#1c3f7a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;text-align:center}
header{background:linear-gradient(#7fc0ec,var(--sky));padding:12px 10px 6px;position:relative;overflow:hidden}
h1{display:inline-block;background:var(--yl);color:#12307a;margin:4px;padding:8px 16px;border-radius:14px;font-size:1.15rem;transform:rotate(-1.5deg)}
.sub{color:var(--bl);font-weight:bold;margin:3px;font-size:.9rem}
.cloud{position:absolute;font-size:2rem;opacity:.8;animation:fly 18s linear infinite}
@keyframes fly{from{left:-10%}to{left:110%}}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes sw{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-3px) rotate(1.2deg)}}
button{font:inherit;cursor:pointer;border:0}
nav{display:flex;gap:4px;justify-content:flex-start;padding:8px 6px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button,nav a{background:var(--bl);color:#fff;padding:8px 9px;border-radius:12px;font-weight:bold;font-size:.78rem;white-space:nowrap;text-decoration:none;flex:none}
nav a{background:var(--pk)}
nav button.on{background:var(--yl);color:#12307a;transform:scale(1.08)}
.ban{display:inline-block;background:var(--bl);color:#fff;padding:8px 20px;border-radius:12px;font-size:1.2rem;margin:8px 0}
.say{background:var(--yl);color:#12307a;padding:10px 16px;border-radius:20px;font-weight:bold;margin:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;padding:10px;max-width:780px;margin:auto}
.fl{perspective:800px;height:120px;animation:pop .4s backwards;cursor:pointer}
.in{position:relative;height:100%;transition:transform .6s;transform-style:preserve-3d}
.fl.f .in{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--bl);border-radius:16px;background:var(--card);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;padding:6px}
.fb{transform:rotateY(180deg);background:var(--yl);color:#12307a}
.fl b{font-size:1.05rem}
.fl:nth-child(odd) .fa{animation:sw 3s ease-in-out infinite}
.fl:nth-child(even) .fa{animation:sw 3s ease-in-out infinite reverse}
.ar{font-size:.95rem;color:#a02a35;font-weight:bold}
.ex{font-size:.72rem;font-style:italic}
footer{background:var(--bl);color:#fff;padding:12px;margin-top:16px;font-weight:bold}

.hc{border-radius:22px;padding:12px 6px;color:#fff;cursor:pointer;box-shadow:0 5px 0 #0003;animation:pop .5s backwards,bob 3s ease-in-out infinite;transition:transform .15s}
.hc:active{transform:scale(.93)}.hc .ic{font-size:2.1rem;display:block}.hc b{font-size:.95rem;display:block}.hc small{font-size:.78rem;opacity:.95}
.k0{background:#1e4fa8}.k1{background:#e8707a}.k2{background:#2fa36b}.k3{background:#8e44ad}.k4{background:#e08a1e}.k5{background:#12307a;border:3px solid var(--yl)}
.tp{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px;max-width:560px;margin:auto}
.box{max-width:560px;margin:auto;padding:6px 12px 14px}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.go{background:var(--bl);color:#fff;padding:9px 14px;border-radius:18px;font-weight:bold;font-size:.9rem;box-shadow:0 3px 0 #0003}
.go.on{background:var(--yl);color:#12307a}.go.pk{background:var(--pk)}
.bb{max-width:88%;margin:9px 0;padding:8px 12px;border-radius:18px;text-align:left;cursor:pointer;border:3px solid var(--bl);background:var(--card);animation:pop .35s backwards}
.bb.r{margin-left:auto;background:var(--yl);color:#12307a;border-color:#e0c200}
.bb.now{outline:4px solid var(--pk);transform:scale(1.03)}
.who{font-size:.7rem;font-weight:bold;opacity:.7}
.en{font-size:1.1rem;font-weight:bold}
.bb .ar{font-size:.95rem;color:#a02a35;font-weight:bold;max-height:0;overflow:hidden;opacity:0;transition:all .35s;text-align:right}
.bb.show .ar,.all .bb .ar{max-height:80px;opacity:1;margin-top:4px}
.bb.mine .en{filter:blur(7px)}.bb.mine.show .en{filter:none}
#turn{font-weight:bold;color:var(--pk);min-height:1.4em}
</style><link rel="stylesheet" href="play.css"></head><body>
<header><span class="cloud" style="top:8px">☁️</span><span class="cloud" style="top:50px;animation-delay:-9s">☁️</span>
<h1>Top 20 Phrases ⭐</h1><p class="sub">Learn these first! احفظ هذه العبارات أولًا</p></header>
<nav><a href="index.html">🏠 Home</a><a href="talk.html" style="background:var(--bl)">💬 Talk</a><a href="games.html">🎮 Games</a><a href="conversation.html">🗣️ Speaking practice</a></nav>
<main class="box"><div class="ban">⭐ Must-know phrases</div><br><button class="go" id="all">🔊 Hear all</button>
<div class="grid" id="g"></div></main>
<footer>Practice ⭐ Learn ⭐ Improve</footer>
<script>
const RAW=`How are you?|كيف حالك؟
What are you doing?|ماذا تفعل؟
Where are you going?|إلى أين أنت ذاهب؟
What do you want?|ماذا تريد؟
Can you help me?|هل يمكنك مساعدتي؟
Can I help you?|هل يمكنني مساعدتك؟
Can I have...?|هل يمكنني الحصول على...؟
I would like...|أود...
I don't understand.|لا أفهم.
Can you repeat, please?|هل يمكنك التكرار، من فضلك؟
What does this mean?|ماذا يعني هذا؟
How much is it?|كم سعره؟
Where is...?|أين...؟
I'm looking for...|أبحث عن...
What time is it?|كم الساعة؟
I'm sorry.|أنا آسف.
That's okay.|لا بأس.
Thank you.|شكرًا.
You're welcome.|على الرحب والسعة.
See you later!|أراك لاحقًا!`;
function say(t,p=1.2){return new Promise(r=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;u.pitch=p;u.onend=r;u.onerror=r;speechSynthesis.speak(u)}catch(e){r()}})}const L=RAW.split("\n").map(x=>x.split("|")),g=document.getElementById("g");
g.innerHTML=L.map((p,i)=>`<div class="fl" data-i="${i}" style="animation-delay:${i*.04}s"><div class="in"><div class="fa"><small>${i+1}</small><b></b></div><div class="fb"><span class="ar" dir="auto" style="font-size:1.1rem"></span></div></div></div>`).join("");
[...g.children].forEach((c,i)=>{c.querySelector(".fa b").textContent=L[i][0];c.querySelector(".ar").textContent=L[i][1]});
g.onclick=e=>{const c=e.target.closest(".fl");if(!c)return;c.classList.toggle("f");say(L[+c.dataset.i][0])};
document.getElementById("all").onclick=async()=>{for(let i=0;i<L.length;i++){const c=g.children[i];c.scrollIntoView({block:"center",behavior:"smooth"});c.classList.add("f");await say(L[i][0]);await new Promise(r=>setTimeout(r,300))}};

</script></body></html>
