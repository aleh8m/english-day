<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Days & Months 📅</title>
<style>
:root{--bl:#1e4fa8;--sky:#cfe6f7;--yl:#fbe97a;--pk:#e8707a;--bg:#eaf4fc;--tx:#12307a;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2347;--card:#16356b;--tx:#eaf4ff;--sky:#1c3f7a}}
:root[data-theme="dark"]{--bg:#0f2347;--card:#16356b;--tx:#eaf4ff;--sky:#1c3f7a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;text-align:center}
header{background:linear-gradient(#7fc0ec,var(--sky));padding:12px 10px 6px;position:relative;overflow:hidden}
h1{display:inline-block;background:var(--yl);color:#12307a;margin:4px;padding:8px 16px;border-radius:14px;font-size:1.15rem;transform:rotate(-1.5deg)}
.sub{color:var(--bl);font-weight:bold;margin:3px;font-size:.9rem}
.cloud{position:absolute;font-size:2rem;opacity:.8;animation:fly 18s linear infinite}
@keyframes fly{from{left:-10%}to{left:110%}}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes sw{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-3px) rotate(1.2deg)}}
button{font:inherit;cursor:pointer;border:0}
nav{display:flex;gap:4px;justify-content:flex-start;padding:8px 6px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button,nav a{background:var(--bl);color:#fff;padding:8px 9px;border-radius:12px;font-weight:bold;font-size:.78rem;white-space:nowrap;text-decoration:none;flex:none}
nav a{background:var(--pk)}
nav button.on{background:var(--yl);color:#12307a;transform:scale(1.08)}
.ban{display:inline-block;background:var(--bl);color:#fff;padding:8px 20px;border-radius:12px;font-size:1.2rem;margin:8px 0}
.say{background:var(--yl);color:#12307a;padding:10px 16px;border-radius:20px;font-weight:bold;margin:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;padding:10px;max-width:780px;margin:auto}
.fl{perspective:800px;height:120px;animation:pop .4s backwards;cursor:pointer}
.in{position:relative;height:100%;transition:transform .6s;transform-style:preserve-3d}
.fl.f .in{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--bl);border-radius:16px;background:var(--card);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;padding:6px}
.fb{transform:rotateY(180deg);background:var(--yl);color:#12307a}
.fl b{font-size:1.05rem}
.fl:nth-child(odd) .fa{animation:sw 3s ease-in-out infinite}
.fl:nth-child(even) .fa{animation:sw 3s ease-in-out infinite reverse}
.ar{font-size:.95rem;color:#a02a35;font-weight:bold}
.ex{font-size:.72rem;font-style:italic}
footer{background:var(--bl);color:#fff;padding:12px;margin-top:16px;font-weight:bold}

@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.box{max-width:560px;margin:auto;padding:6px 12px 14px}
.lt{font-size:2.6rem;font-weight:900;color:var(--pk)}.lt small{font-size:1.6rem;color:var(--bl)}
.fb .em{font-size:2.2rem}.fb b{font-size:1rem}.fb .ar{font-size:.85rem;color:#a02a35;font-weight:bold}
#sp{background:var(--card);border:3px dashed var(--bl);border-radius:18px;padding:14px;margin-top:10px}
.pic{font-size:4.5rem;animation:bob 2s infinite}
.slots,.tiles{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.slot{width:46px;height:54px;border-bottom:4px solid var(--bl);font-size:1.9rem;font-weight:900;display:flex;align-items:center;justify-content:center;color:#1c8a3d}
.tile{width:50px;height:54px;border-radius:12px;background:var(--yl);color:#12307a;font-size:1.7rem;font-weight:900;box-shadow:0 4px 0 #0003}
.tile:active{transform:scale(.9)}.tile.bad{animation:shake .4s;background:#ffc2c2}.tile.used{visibility:hidden}
.go{background:var(--bl);color:#fff;padding:9px 16px;border-radius:18px;font-weight:bold;box-shadow:0 3px 0 #0003;margin:4px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
#pr{position:fixed;left:50%;top:35%;transform:translate(-50%,-50%);z-index:60;font-size:2rem;font-weight:bold;color:#fff;text-shadow:0 3px 0 #1e4fa8;pointer-events:none;opacity:0}
#pr.on{animation:boom 1.4s}@keyframes boom{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-90%)}}

.top{display:flex;justify-content:space-between;font-weight:bold;margin:6px 0}
.bar{height:14px;background:var(--sky);border-radius:10px;overflow:hidden;border:2px solid var(--bl)}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd24d,#ff7a59);transition:width .5s}
#qc{background:var(--card);border:3px dashed var(--bl);border-radius:18px;padding:14px;margin-top:10px}
.q{font-size:1.3rem;font-weight:bold;margin:8px 0}.qa{color:var(--pk);font-weight:bold;margin-bottom:6px}
.opt{display:inline-block;min-width:46%;margin:5px;padding:12px;border-radius:14px;background:var(--sky);color:var(--tx);border:3px solid var(--bl);font-size:1.15rem;font-weight:bold}
.opt.ok{background:#7be08a!important;color:#0b3d1c!important}.opt.no{background:#ffc2c2!important;color:#5a1010!important;animation:shake .5s}
.tip{background:var(--yl);color:#12307a;border-radius:12px;padding:6px 10px;margin:8px 0;display:inline-block;font-size:.9rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 2px;justify-content:center;flex-wrap:wrap}.chips .go.on{background:var(--yl);color:#12307a}
.em1{font-size:2.6rem}.big{font-size:3rem}#td{background:var(--card);border:3px solid var(--yl);border-radius:16px;padding:8px;margin:8px 0;font-weight:bold}
.fl.sm{height:100px}
</style><link rel="stylesheet" href="play.css"></head><body>
<canvas id="fx"></canvas><div id="pr"></div>
<header><span class="cloud" style="top:8px">☁️</span><span class="cloud" style="top:50px;animation-delay:-9s">☁️</span>
<h1>Days & Months 📅</h1><p class="sub">Level 2 🌿 — الأيام والشهور والفصول</p></header>
<nav><a href="index.html">🏠 Home</a><button data-t="days">📆 Days</button><button data-t="months">🗓️ Months</button><button data-t="seasons">🌦️ Seasons</button><button data-t="game">🎮 Game</button><a href="games.html">🎮 Games</a><a href="conversation.html">🗣️ Speaking practice</a></nav>
<div class="box" style="padding-bottom:0"><div id="td"></div></div>
<main class="box" id="m"></main>
<footer>Practice ⭐ Learn ⭐ Improve</footer>
<script>
function say(t,r=.8){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=r;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}}
let ac;function sfx(f,d=.2){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="triangle";g.gain.setValueAtTime(.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const cv=document.getElementById("fx"),cx=cv.getContext("2d");let P=[],raf=0;cv.width=innerWidth;cv.height=innerHeight;
function burst(){const x=cv.width*(.2+Math.random()*.6),y=cv.height*(.15+Math.random()*.35),h=Math.random()*360;for(let k=0;k<44;k++){const a=6.28*k/44,s=2+Math.random()*4;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h})}if(!raf)raf=requestAnimationFrame(fr)}
function fr(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>.02);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.l-=.014;cx.globalAlpha=p.l;cx.fillStyle=`hsl(${p.h},100%,60%)`;cx.beginPath();cx.arc(p.x,p.y,3,0,7);cx.fill()});P.length?raf=requestAnimationFrame(fr):(raf=0,cx.clearRect(0,0,cv.width,cv.height))}
function party(t){const p=document.getElementById("pr");p.textContent=t;p.classList.remove("on");void p.offsetWidth;p.classList.add("on");for(let k=0;k<4;k++)setTimeout(()=>{burst();sfx(300+k*150)},k*250)}
const m=document.getElementById("m");

const sh=a=>[...a].sort(()=>Math.random()-.5),pick=a=>a[Math.random()*a.length|0];
const opts=(ans,pool)=>sh(sh([...new Set(pool.filter(x=>x!==ans))]).slice(0,3).concat(ans));
function quiz(gen){const N=10,qs=[],used=new Set();let i=0,sc=0,t=0;
while(qs.length<N&&t++<400){const q=gen(),k=q.q+(q.big||"");if(!used.has(k)){used.add(k);qs.push(q)}}
function ask(){const q=qs[i];let done=0;
m.innerHTML=`<div class="top"><span>Question ${i+1}/${N}</span><span>⭐ ${sc}</span></div><div class="bar"><i style="width:${i*10}%"></i></div><div id="qc">${q.big?`<div class="big">${q.big}</div>`:""}<div class="q">${q.q}</div>${q.qa?`<div class="qa">${q.qa}</div>`:""}<div>${q.o.map(x=>`<button class="opt" dir="auto">${x}</button>`).join("")}</div><div id="fb"></div></div>`;
setTimeout(()=>document.querySelector(".bar i").style.width=(i*10+3)+"%",50);if(q.say)say(q.say,.8);
m.onclick=e=>{const b=e.target.closest(".opt");if(!b||done)return;done=1;const ok=b.textContent===q.ans;
document.querySelectorAll(".opt").forEach(x=>{if(x.textContent===q.ans)x.classList.add("ok")});
const fb=document.getElementById("fb");
if(ok){sc++;party(["Amazing! 🌟","Super! 🎉","Fantastic! 🏆","You rock! 🚀"][i%4]);fb.innerHTML="<b>🎉 أحسنت!</b>"}
else{b.classList.add("no");sfx(180,.3);fb.innerHTML="<b>Good try! 💪 حاول مرة ثانية</b>"}
fb.innerHTML+=`<br><span class="tip">💡 ${q.tip}</span><br><button class="go" id="nx">${i==N-1?"Result 🏆":"Next ➡️"}</button>`;
document.getElementById("nx").onclick=()=>{i++;i>=N?end():ask()}}}
function end(){const r=sc==10?["🏆🌟🌟🌟","Perfect! أنت نجم!"]:sc>=7?["🥇🌟🌟","Great job! أحسنت!"]:sc>=4?["🥈🌟","Good! تدرّب أكثر!"]:["💪","Keep trying! لا تستسلم!"];
m.innerHTML=`<div class="ban">Result</div><div id="qc"><div class="big">${r[0]}</div><h2>${sc} / ${N}</h2><p>${r[1]}</p><button class="go" id="ag">Play again 🔁</button></div>`;
document.getElementById("ag").onclick=()=>quiz(gen);if(sc>=5)for(let k=0;k<6;k++)setTimeout(()=>party(k==0?"🏆 Well done! 🏆":""),k*600)}
ask()}

const DY=[["Sunday","الأحد"],["Monday","الاثنين"],["Tuesday","الثلاثاء"],["Wednesday","الأربعاء"],["Thursday","الخميس"],["Friday","الجمعة"],["Saturday","السبت"]];
const MO=[["January","كانون الثاني","❄️"],["February","شباط","💝"],["March","آذار","🌷"],["April","نيسان","🌧️"],["May","أيار","🌸"],["June","حزيران","☀️"],["July","تموز","🏖️"],["August","آب","🍉"],["September","أيلول","🍂"],["October","تشرين الأول","🍁"],["November","تشرين الثاني","🌬️"],["December","كانون الأول","⛄"]];
const SE=[["Spring","الربيع","🌸","March, April, May"],["Summer","الصيف","☀️","June, July, August"],["Autumn","الخريف","🍂","September, October, November"],["Winter","الشتاء","❄️","December, January, February"]];
const SM=[3,3,0,0,0,1,1,1,2,2,2,3];
const od=n=>n+(["th","st","nd","rd"][(n%10>3||(n%100>10&&n%100<14))?0:n%10]);
const N=new Date(),dd=N.getDay(),mm=N.getMonth();
const todayEn=`Today is ${DY[dd][0]}, ${MO[mm][0]} ${od(N.getDate())}, ${N.getFullYear()}.`;
document.getElementById("td").innerHTML=`📅 ${todayEn}<br><span style="color:var(--pk)">اليوم ${DY[dd][1]} ${N.getDate()} ${MO[mm][1]} ${N.getFullYear()}</span> <button class="go" id="st">🔊</button>`;
document.getElementById("st").onclick=()=>say(todayEn,.8);
function cards(h,p,L,fr,bk,sp){m.innerHTML=`<div class="ban">${h}</div><p>${p}</p><div class="grid">${L.map((x,i)=>`<div class="fl" data-i="${i}" style="animation-delay:${i*.04}s"><div class="in"><div class="fa">${fr(x,i)}</div><div class="fb">${bk(x,i)}</div></div></div>`).join("")}</div>`;
m.onclick=e=>{const f=e.target.closest(".fl");if(!f)return;f.classList.toggle("f");say(sp(L[+f.dataset.i]),.8)}}
const TABS={days(){cards("📆 Days of the Week","7 أيام — اكبس على اليوم لتسمعه",DY,(x,i)=>`<small>${i+1}</small><b style="font-size:1.1rem">${x[0]}</b>`,(x,i)=>`<span class="ar" style="font-size:1.3rem">${x[1]}</span><small>${i>=5?"🎉 Weekend":"🏫 School day"}</small>`,x=>x[0])},
months(){cards("🗓️ Months of the Year","12 شهرًا — اكبس على الشهر",MO,(x,i)=>`<span class="em1">${x[2]}</span><b>${x[0]}</b>`,(x,i)=>`<span class="ar" style="font-size:1.2rem">${x[1]}</span><small>Month ${i+1}</small>`,x=>x[0])},
seasons(){cards("🌦️ Seasons","4 فصول — اكبس على الفصل",SE,x=>`<span class="em1">${x[2]}</span><b>${x[0]}</b>`,x=>`<span class="ar" style="font-size:1.3rem">${x[1]}</span><small>${x[3]}</small>`,x=>x[0])},
game(){m.onclick=null;quiz(G)}};
function G(){const t=Math.random()*9|0,i=Math.random()*7|0,j=Math.random()*12|0,D=DY.map(x=>x[0]),M=MO.map(x=>x[0]),S=SE.map(x=>x[0]);
const tip=`${D.join(" → ")}`;
switch(t){
case 0:return{q:`Which day comes after ${D[i]}?`,qa:"أي يوم يأتي بعد؟",ans:D[(i+1)%7],o:opts(D[(i+1)%7],D),tip};
case 1:return{q:`Which day comes before ${D[i]}?`,qa:"أي يوم يأتي قبل؟",ans:D[(i+6)%7],o:opts(D[(i+6)%7],D),tip};
case 2:return{q:`Which month comes after ${M[j]}?`,qa:"أي شهر يأتي بعد؟",ans:M[(j+1)%12],o:opts(M[(j+1)%12],M),tip:`${M[j]} → ${M[(j+1)%12]}`};
case 3:return{q:`Which month comes before ${M[j]}?`,qa:"أي شهر يأتي قبل؟",ans:M[(j+11)%12],o:opts(M[(j+11)%12],M),tip:`${M[(j+11)%12]} → ${M[j]}`};
case 4:return{q:`What is the ${od(j+1)} month of the year?`,qa:"ما ترتيب الشهر؟",ans:M[j],o:opts(M[j],M),tip:`${j+1} = ${M[j]} (${MO[j][1]})`};
case 5:return{q:`What season is ${M[j]} in?`,qa:"في أي فصل هذا الشهر؟",big:MO[j][2],ans:SE[SM[j]][0],o:opts(SE[SM[j]][0],S),tip:`${M[j]} → ${SE[SM[j]][0]} (${SE[SM[j]][1]})`};
case 6:return{q:`How do you say “${DY[i][1]}” in English?`,qa:"ما اسمه بالإنجليزية؟",ans:D[i],o:opts(D[i],D),tip:`${DY[i][1]} = ${D[i]}`};
case 7:return{q:`How do you say “${MO[j][1]}” in English?`,qa:"ما اسمه بالإنجليزية؟",ans:M[j],o:opts(M[j],M),tip:`${MO[j][1]} = ${M[j]}`};
default:return Math.random()<.5?{q:"How many days are in a week?",qa:"كم يومًا في الأسبوع؟",big:"📆",ans:"7",o:["5","6","7","8"],tip:"7 days"}:{q:"How many months are in a year?",qa:"كم شهرًا في السنة؟",big:"🗓️",ans:"12",o:["10","11","12","13"],tip:"12 months"}}}

const tb=[...document.querySelectorAll("nav button")];
function tab(t){tb.forEach(b=>b.classList.toggle("on",b.dataset.t==t));window.scrollTo(0,0);TABS[t]()}
tb.forEach(b=>b.onclick=()=>tab(b.dataset.t));
tab("days");
</script></body></html>
