function say(t,p=1.2){return new Promise(r=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;u.pitch=p;u.onend=r;u.onerror=r;speechSynthesis.speak(u)}catch(e){r()}})}const D=RAW.split("\n#").map(b=>{const L=b.replace(/^#/,"").split("\n");const[e,t,a]=L[0].split("|");return{e,t,a,l:L.slice(1).map(x=>{const[s,en,ar]=x.split("|");return{s,en,ar}})}});
const m=document.getElementById("m"),bk=document.getElementById("bk");let tok=0,cur=0,role=null,allAr=false;
const sl=ms=>new Promise(r=>setTimeout(r,ms));
function topics(){tok++;try{speechSynthesis.cancel()}catch(e){}bk.style.display="none";
m.innerHTML=`<div class="ban">Choose a conversation 💬</div><p>اختر محادثة، اكبس على أي جملة لتسمعها وتشوف معناها 👆</p><div class="tp">${D.map((d,i)=>`<div class="hc k${i%6}" data-i="${i}" style="animation-delay:${i*.04}s,${i*.2}s"><span class="ic">${d.e}</span><b>${i+1}. ${d.t}</b><small>${d.a}</small></div>`).join("")}</div>`;
m.onclick=e=>{const c=e.target.closest(".hc");if(c)open(+c.dataset.i)};window.scrollTo(0,0)}
function open(i){tok++;cur=i;role=null;allAr=false;bk.style.display="";const d=D[i],sp=[...new Set(d.l.map(x=>x.s))];
m.innerHTML=`<div class="ban">${d.e} ${d.t}</div><div class="sub" style="color:var(--pk)">${d.a}</div>
<div class="tools"><button class="go" id="pl">▶️ Play all</button><button class="go" id="ta">👁 Show Arabic</button></div>
<div class="tools"><span style="font-weight:bold">🎭 Role play:</span>${sp.slice(0,2).map(s=>`<button class="go pk rl" data-s="${s}">I'm ${s}</button>`).join("")}</div>
<div id="turn"></div><div id="ch">${d.l.map((x,k)=>`<div class="bb ${sp.indexOf(x.s)%2?"r":""}" data-k="${k}"><span class="who">${x.s}</span><div class="en">${x.en}</div><div class="ar" dir="auto">${x.ar}</div></div>`).join("")}</div>
<div class="tools"><button class="go" id="nx">Next conversation ➡️</button><button class="go on" id="tp">📋 Topics</button></div>`;
const ch=document.getElementById("ch"),pl=document.getElementById("pl"),turn=document.getElementById("turn");
const pitch=s=>sp.indexOf(s)==0?1.35:sp.indexOf(s)==1?.85:1.1;
const mark=()=>[...ch.children].forEach(b=>b.classList.toggle("mine",!!role&&d.l[+b.dataset.k].s===role&&!b.classList.contains("show")));
ch.onclick=e=>{const b=e.target.closest(".bb");if(!b)return;tok++;pl.textContent="▶️ Play all";turn.textContent="";b.classList.toggle("show");mark();say(d.l[+b.dataset.k].en,pitch(d.l[+b.dataset.k].s))};
document.getElementById("ta").onclick=e=>{allAr=!allAr;ch.classList.toggle("all",allAr);e.target.classList.toggle("on",allAr)};
document.querySelectorAll(".rl").forEach(b=>b.onclick=()=>{role=role===b.dataset.s?null:b.dataset.s;document.querySelectorAll(".rl").forEach(x=>x.classList.toggle("on",x.dataset.s===role));[...ch.children].forEach(x=>x.classList.remove("show"));mark();turn.textContent=role?`🎭 You are ${role}! Say your lines, then tap to check.`:""});
pl.onclick=async()=>{if(pl.textContent.startsWith("⏹")){tok++;try{speechSynthesis.cancel()}catch(e){}pl.textContent="▶️ Play all";return}
const my=++tok;pl.textContent="⏹ Stop";
for(let k=0;k<d.l.length;k++){if(my!=tok)return;const b=ch.children[k];[...ch.children].forEach(x=>x.classList.remove("now"));b.classList.add("now");b.scrollIntoView({block:"center",behavior:"smooth"});
if(role&&d.l[k].s===role){turn.textContent="🎤 Your turn! دورك!";await sl(4000);if(my!=tok)return;b.classList.add("show");mark();turn.textContent=""}
