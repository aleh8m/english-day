<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kids English Basics</title><link rel="stylesheet" href="layout.css"><link rel="stylesheet" href="play.css"><link rel="stylesheet" href="navigation.css"></head><body><a class="return-home" href="index.html">🏠 العودة للصفحة الرئيسية · Home</a><header><h1>Little Stars 🌱</h1><p dir="rtl">المستوى الأول — كلماتك الأولى في الإنجليزية</p></header><nav><a href="index.html">🏠 Learning path</a><a href="alphabet.html">🔤 Letters</a><a href="games.html?level=1">🎮 Practice</a></nav><main><p dir="rtl">اضغط على الكلمة لتسمعها، ثم جرّب ألعاب الصور والاستماع.</p><section class="lesson" id="numbers"><h2>Numbers · الأرقام</h2><div class="tiles" id="number-list"></div></section><section class="lesson" id="colors"><h2>Colors · الألوان</h2><div class="tiles" id="color-list"></div></section><section class="lesson"><h2>My first sentences · جُملي الأولى</h2><div id="first-sentences"></div></section><a href="games.html?level=1">Next: Picture games →</a></main><script>
function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}
const numbers='one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty'.split(' ');document.querySelector('#number-list').innerHTML=numbers.map((w,i)=>`<button data-say="${w}">${i+1} · ${w}</button>`).join('');const colors=[['red','أحمر','#e74c3c'],['blue','أزرق','#3498db'],['yellow','أصفر','#f1c40f'],['green','أخضر','#27ae60'],['orange','برتقالي','#f39c12'],['purple','بنفسجي','#8e44ad'],['pink','وردي','#ff8fba'],['black','أسود','#222'],['white','أبيض','#fff'],['brown','بني','#88552f']];document.querySelector('#color-list').innerHTML=colors.map(c=>`<button data-say="${c[0]}"><span class="swatch" style="background:${c[2]}"></span>${c[0]} · ${c[1]}</button>`).join('');const phrases=[['My name is Sara.','اسمي سارة.'],['I am seven years old.','عمري سبع سنوات.'],['I like apples.','أحب التفاح.'],['This is a red ball.','هذه كرة حمراء.'],['I have two cats.','لدي قطتان.']];document.querySelector('#first-sentences').innerHTML=phrases.map(p=>`<div class="phrase"><span>${p[0]}<small>${p[1]}</small></span><button data-say="${p[0]}">🔊 Listen</button></div>`).join('');document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)speak(b.dataset.say)});
</script></body></html>
